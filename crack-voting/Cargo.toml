[package]
name = "crack-voting"
version = "0.7.0"
edition = "2021"
authors = ["Cycle Five <cycle.five@proton.me>"]
publish = true
license = "MIT"
description = "Service to handle toplist voting for Crack Tunes."
keywords = ["music", "discord", "bot", "crack", "tunes", "top.gg", "dbl"]
categories = [
  "multimedia::audio",
  "multimedia::music",
  "multimedia::discord",
  "multimedia::bot",
]
homepage = "https://cracktun.es/"
# The official main repo is sr.ht, this is needed for the CI/CD pipeline.
#repository = "https://git.sr.ht/~cycle-five/cracktunes"
repository = "https://github.com/cycle-five/cracktunes"
workspace = ".."

[package.metadata.wix]
upgrade-guid = "E1895C93-409A-4681-87E4-B2808D22D0F8"
path-guid = "08ECB7E7-1E6E-4C7A-9C08-2EF1DD1CE768"
license = false
eula = false

# [package.metadata.dist]
# dist = false

[features]
# Tests that need a live postgres at DATABASE_URL. Off by default: the bot runs
# without a database, so its test suite has to as well -- otherwise every
# checkout without postgres reports 20+ red tests that say nothing about the
# change under review. The gated tests are still COMPILED, so they cannot rot;
# CI turns this on. See docs/testing.md.
db-tests = []

[dependencies]
lazy_static = "1.5"
dbl-rs = "0.4"
# 🔑 `server` is REQUIRED from 0.4 on. warp 0.4 moved `warp::serve` behind a
# feature and made `default = []`, so a plain `default-features = false` builds
# a warp with no server in it and fails on `warp::serve` in lib.rs. Note 0.4
# upstreamed what #430 did by hand -- websocket and multipart are no longer
# default -- so this crate keeps getting the lean warp it asked for.
warp = { version = "0.4", default-features = false, features = ["server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { workspace = true }
tracing = { workspace = true }

sqlx = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
# `warp::test` is its own feature in 0.4 and pulls a hyper CLIENT. Kept out of
# [dependencies] deliberately: cargo unions features for the test build, so the
# tests get it while the shipped binary stays server-only.
warp = { version = "0.4", default-features = false, features = ["test"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
