[package]
name = "crack-gp"
version.workspace = true
edition = "2021"
authors = ["Cycle Five <cycle.five@proton.me>"]
publish = true
license = "MIT"
description = "The /gp game, its saved form, its prompts and its table for Crack Tunes."
keywords = ["music", "bot", "crack", "tunes", "game"]
homepage = "https://cracktun.es/"
repository = "https://github.com/cycle-five/cracktunes"
workspace = ".."

[features]
# Tests that need a live postgres at DATABASE_URL: see docs/testing.md.
db-tests = []
# The features a cargo-mutants run needs, valid on any one crate: see .cargo/mutants.toml.
mutation-testing = ["db-tests"]
# The fixtures in `gp::test_support`, for other crates' tests: enable as a dev-dependency.
test-support = ["crack-music/test-support"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
once_cell = "1.20"
rand = "0.10"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
crack-common = { path = "../crack-common" }
crack-model = { path = "../crack-model" }
crack-music = { path = "../crack-music" }
crack-testing = { path = "../crack-testing" }
crack-types = { path = "../crack-types" }

tracing = { workspace = true }
sqlx = { workspace = true }
serenity = { workspace = true }
songbird = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
crack-test-macros = { path = "../crack-test-macros" }
crack-test-db = { path = "../crack-test-db" }
crack-common = { path = "../crack-common", features = ["test-support"] }
# The player's fixtures (music::ops::test_support).
crack-music = { path = "../crack-music", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
