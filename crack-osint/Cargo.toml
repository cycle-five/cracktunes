[package]
name = "crack-osint"
version = "0.1.0"
edition = "2021"
authors = ["Cycle Five <cycle.five@proton.me>"]
publish = true
license = "MIT"
description = "OSINT module for Cracktunes."
keywords = ["music", "discord", "bot", "crack", "tunes"]
categories = ["multimedia::audio"]
homepage = "https://cracktun.es/"
repository = "https://github.com/cycle-five/crack-osint"

[dependencies]
sha1 = "0.10"
ipinfo = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1.34.0", features = ["full"] }
tracing = "0.1.40"
reqwest = { version = "0.12.9", default-features = false, features = [
  "blocking",
  "json",
  "multipart",
  "rustls-tls",
  "cookies",
  "charset",
  "http2",
  "macos-system-configuration",
] }

[features]
default = ["checkpass", "virustotal", "scan"]
checkpass = []
virustotal = []
scan = []
#phone = []
#social = []
#wayback = []
#whois = []
#ip = []
