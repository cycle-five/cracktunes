# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/" # Location of package manifests
    # 🔑 Weekly and grouped, not daily and one PR per crate. Each merge of a
    # lockfile bump invalidates the image's cached dependency layer and costs a
    # full ~29-minute master image build instead of a ~14-minute one; five bumps
    # merged separately on 2026-09-17 cost five of them. One grouped PR a week
    # costs one, and is how the batch was triaged anyway.
    schedule:
      interval: "weekly"
    groups:
      # Majors stay on their own: they are the ones that edit a Cargo.toml and
      # may need call-site work (rand 0.10, warp 0.4), and they are judged per
      # crate. Minor and patch bumps are the lockfile-only batch.
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    allow:
      - dependency-type: "all"
    ignore:
      # symphonia's version is not ours to choose. songbird pins `^0.5.2` on
      # EVERY branch -- current, next, serenity-next (the one we track) and
      # v0.4.x -- with no open issue or PR proposing 0.6. Our direct dependency
      # exists to unify with songbird's and to switch on the codec features
      # songbird itself declares `default-features = false` for; it is not an
      # independent choice we can bump.
      #
      # A 0.5 -> 0.6 bump therefore cannot compile: two `symphonia-core` crates
      # land in one graph, and `impl MediaSource` in crack-core is then written
      # against a different trait than the one songbird's `Compose` expects.
      # That is E0053, and it is trait *identity*, not a trait change -- the
      # `MediaSource` trait is byte-identical between 0.5.5 and 0.6.1.
      #
      # Patch updates inside 0.5.x are still wanted, so only minor and major are
      # ignored. Revisit when songbird ships symphonia 0.6; see
      # docs/symphonia-and-songbird.md for what that port involves.
      - dependency-name: "symphonia"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # Must track symphonia exactly, so it hits the same wall.
      - dependency-name: "symphonia-metadata"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # 🔑 Action versions. Without this entry nothing ever proposed moving them, so
  # every workflow was still on Node 20 majors in September 2026, three months
  # after GitHub began forcing them onto Node 24 and days before Node 20 left the
  # runners. One grouped PR a week: a bump to docker.yml triggers the ~20-minute
  # Docker PR Check, which is worth paying once, not once per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Deliberately held at v4 in the manual-only coverage.yml; see the note on
      # that step. Moves with tarpaulin's replacement.
      - dependency-name: "codecov/codecov-action"
        update-types:
          - "version-update:semver-major"
