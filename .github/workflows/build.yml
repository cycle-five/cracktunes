name: Main Workflow

on:
  workflow_call:

# Least privilege: these jobs only check out and build.
permissions:
  contents: read

# 🪤 ubuntu-26.04 (ubuntu-latest since 2026-10-24) ships CMake 4, which refuses
# any `cmake_minimum_required` below 3.5. audiopus_sys 0.2.2 (songbird's opus
# build) declares an older one, so its build script fails on a cold cache.
# This is the opt-in CMake's own error message names.
env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    name: Build
    strategy:
      matrix:
        rust-version: ["nightly", "stable"]
        cache-key: [""]
    runs-on: ubuntu-latest
      # redis:
      #   image: redis:latest
      #   ports:
      #     - 6379/tcp

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v7

      - name: "Install yt-dlp"
        run: |
          curl -sSL --output /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x /usr/local/bin/yt-dlp
        shell: bash

      - name: "Install Rust"
        run: |
          rustup toolchain install ${{ matrix.rust-version }} --profile minimal --no-self-update
          rustup install nightly
          rustup default ${{ matrix.rust-version }}
          rustup update
        shell: bash
      
      # 🪤 A commit, not @v8. v8 adds the PGDG signing key with `apt-key`,
      # which the ubuntu-26.04 image doesn't have, and ubuntu-latest moved
      # to 26.04 on 2026-10-24. Upstream fixed it in their #68 but hasn't
      # tagged a release since v8 (their issue #77). Go back to a tag once
      # one ships. v8..this commit changes nothing we use; it only adds
      # inputs, drops postgres 14 and URI-encodes the credentials.
      - uses: ikalnytskyi/action-setup-postgres@0f1fdf59c857aabfa61ab1a2619e9af34de678d3 # master, 2026-08-02
        with:
          username: postgres
          password: mysecretpassword
          database: postgres
          port: 5432
          # 🪤 PIN THIS. v4 used the runner's preinstalled server, which is
          # 16.15; v8 installs from PGDG and defaults to 18. Both stacks run
          # postgres:16-alpine, so an unpinned major would test the bot
          # against a server it never runs on.
          postgres-version: "16"
        id: postgres

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache-key }}

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Migrate database
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
          PG_USER: postgres
          PG_PASSWORD: mysecretpassword
        run: |
          sqlx database create
          sqlx migrate run --source migrations/
          cargo sqlx prepare --workspace -- --tests --all

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149

      - name: Run Unit Tests
        if: github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/')
        env:
          VIRUSTOTAL_API_KEY: ${{secrets.VIRUSTOTAL_API_KEY}}
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
          PG_USER: postgres
          PG_PASSWORD: mysecretpassword
        # CI provisions postgres above, so the database-backed tests run here.
        # They are ignored by default so the suite is green without one.
        # nextest does not run doctests, so `cargo test --doc` keeps them running.
        run: |
          cargo nextest run --profile ci --workspace --features crack-core/db-tests,cracktunes/db-tests,crack-voting/db-tests,crack-core/crack-coin,crack-test-db/db-tests,crack-economy/db-tests,crack-economy/crack-coin
          cargo test --doc --workspace --features crack-core/db-tests,cracktunes/db-tests,crack-voting/db-tests,crack-core/crack-coin,crack-test-db/db-tests,crack-economy/db-tests,crack-economy/crack-coin

      - name: Run Release Unit Tests
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        env:
          VIRUSTOTAL_API_KEY: ${{secrets.VIRUSTOTAL_API_KEY}}
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
          PG_USER: postgres
          PG_PASSWORD: mysecretpassword
        # nextest does not run doctests, so `cargo test --doc` keeps them running.
        run: |
          cargo nextest run --profile ci --release --locked --workspace --features crack-core/db-tests,cracktunes/db-tests,crack-voting/db-tests,crack-core/crack-coin,crack-test-db/db-tests,crack-economy/db-tests,crack-economy/crack-coin
          cargo test --doc --release --locked --workspace --features crack-core/db-tests,cracktunes/db-tests,crack-voting/db-tests,crack-core/crack-coin,crack-test-db/db-tests,crack-economy/db-tests,crack-economy/crack-coin

      # - name: Build Binary
      #   if: github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/')
      #   run: cargo build --locked

      - name: Build Release Binary
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        env:
          VIRUSTOTAL_API_KEY: ${{secrets.VIRUSTOTAL_API_KEY}}
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
          PG_USER: postgres
          PG_PASSWORD: mysecretpassword
        run: cargo build --release --locked
