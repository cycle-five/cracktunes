name: Main Workflow

on:
  workflow_call:

# Least privilege: these jobs only check out and build.
permissions:
  contents: read

# 🪤 ubuntu-26.04 (ubuntu-latest since 2026-10-24) ships CMake 4, which refuses
# any `cmake_minimum_required` below 3.5. audiopus_sys 0.2.2 (songbird's opus
# build) declares an older one, so its build script fails on a cold cache.
# This is the opt-in CMake's own error message names.
env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    name: Build
    # 🪤 rust-toolchain.toml pins `stable`, and rustup ranks a toolchain file
    # above `rustup default`. So the `nightly` leg this matrix had until
    # 2026-10-31 built and tested stable (its log said so: "the toolchain
    # 'stable-x86_64-unknown-linux-gnu' is currently in use (overridden by
    # .../rust-toolchain.toml)"), a second copy of this job since the pin moved
    # to stable on 2026-08-22. To really run nightly, use `cargo +nightly`, as
    # lint.yml's fmt does. The one-entry matrix stays because branch protection
    # requires the check by its name, "Build / Build (stable)".
    strategy:
      matrix:
        rust-version: ["stable"]
        cache-key: [""]
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v7

      - name: "Install yt-dlp"
        run: |
          curl -sSL --output /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x /usr/local/bin/yt-dlp
        shell: bash

      - name: "Install Rust"
        run: |
          rustup toolchain install ${{ matrix.rust-version }} --profile minimal --no-self-update
        shell: bash
      
      # 🪤 A commit, not @v8. v8 adds the PGDG signing key with `apt-key`,
      # which the ubuntu-26.04 image doesn't have, and ubuntu-latest moved
      # to 26.04 on 2026-10-24. Upstream fixed it in their #68 but hasn't
      # tagged a release since v8 (their issue #77). Go back to a tag once
      # one ships. v8..this commit changes nothing we use; it only adds
      # inputs, drops postgres 14 and URI-encodes the credentials.
      - uses: ikalnytskyi/action-setup-postgres@0f1fdf59c857aabfa61ab1a2619e9af34de678d3 # master, 2026-08-02
        with:
          username: postgres
          password: mysecretpassword
          database: postgres
          port: 5432
          # 🪤 PIN THIS. v4 used the runner's preinstalled server, which is
          # 16.15; v8 installs from PGDG and defaults to 18. Both stacks run
          # postgres:16-alpine, so an unpinned major would test the bot
          # against a server it never runs on.
          postgres-version: "16"
        id: postgres

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache-key }}

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      # The only place CI applies migrations/ to a real database. The tests
      # below compile their queries against it, since DATABASE_URL is set and
      # SQLX_OFFLINE is not.
      #
      # This step also ran `cargo sqlx prepare --workspace -- --tests --all`:
      # 45-73 s a run, compiling the workspace to rewrite .sqlx/, which nothing
      # read afterwards and no `--check` compared. .sqlx/ keeps its own format
      # (see scripts/sqlx_sync.py) and Lint expands queries from the committed copy.
      - name: Migrate database
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
          PG_USER: postgres
          PG_PASSWORD: mysecretpassword
        run: |
          sqlx database create
          sqlx migrate run --source migrations/

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149

      # One test step for PRs and master alike. Master used to skip it and
      # rebuild the whole suite in --release instead (549 s), for a tree its
      # PR had already tested: branch protection is strict and merges are
      # squashed, so master's commit has the same tree as the PR's last run.
      # Master still runs this debug suite, for two reasons:
      #   - Docker waits on it (`needs: [build, lint]`), so the image is only
      #     built from a commit whose tests passed;
      #   - its saved cache is the one a new PR branch starts from (a PR can
      #     restore caches from its base branch). A --release run saved
      #     release artifacts, which a PR's debug build can't use.
      # `--locked` came with it from the master step: a Cargo.lock that doesn't
      # match the manifests fails here, not in the image build after merge.
      - name: Run Unit Tests
        env:
          VIRUSTOTAL_API_KEY: ${{secrets.VIRUSTOTAL_API_KEY}}
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
          PG_USER: postgres
          PG_PASSWORD: mysecretpassword
        # CI provisions postgres above, so the database-backed tests run here.
        # They are ignored by default so the suite is green without one.
        # nextest does not run doctests, so `cargo test --doc` keeps them running.
        run: |
          cargo nextest run --profile ci --locked --workspace --features crack-core/db-tests,cracktunes/db-tests,crack-voting/db-tests,crack-core/crack-coin,crack-test-db/db-tests,crack-economy/db-tests,crack-economy/crack-coin,crack-rooms/db-tests,crack-guild/db-tests,crack-music/db-tests,crack-gp/db-tests
          cargo test --doc --locked --workspace --features crack-core/db-tests,cracktunes/db-tests,crack-voting/db-tests,crack-core/crack-coin,crack-test-db/db-tests,crack-economy/db-tests,crack-economy/crack-coin,crack-rooms/db-tests,crack-guild/db-tests,crack-music/db-tests,crack-gp/db-tests

      # A master-only "Build Release Binary" step (`cargo build --release
      # --locked`) used to end this job: about 4.7 min a leg, and its binary
      # was never uploaded. The binaries that ship are built elsewhere: the
      # image by docker.yml (`--profile=dist`), the release by cargo-dist.
