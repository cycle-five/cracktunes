name: CI Workflow

on:
  # Branches only. A bare `push:` also matches tag pushes, so cutting a
  # release re-ran this whole workflow -- build and lint on both toolchains --
  # against a commit master had already built and tested minutes earlier.
  # Nothing here is tag-conditional: the Docker job below requires
  # refs/heads/master, and cargo-dist's release lives in release.yml.
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.ref == 'refs/heads/master')
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    secrets: inherit

  lint:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.ref == 'refs/heads/master')
    name: Lint
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  docker:
    name: Docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, lint]
    # docker.yml pushes an image, so this caller must grant packages: write --
    # a called workflow only ever gets what the calling job holds.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    secrets: inherit

