name: Docker Workflow

# 🪤 No `push: branches: [master]` here. `ci_workflow.yml` already calls this
# file on every master push, gated on Build and Lint passing. With this file's
# own master trigger as well, every merge built and pushed the SAME image to
# the SAME tags twice, concurrently, both writing one cache scope: measured on
# ce9225b, 25m42s via ci_workflow and 25m standalone. The standalone copy also
# had no concurrency group, so a superseded commit (aaa29b4, whose CI run was
# cancelled) still got a full 27-minute build.
#
# Tags stay: ci_workflow triggers on branches only, and the tag build is what
# produces the vX.Y.Z image the compose files pin to. It is a retag, not a
# rebuild -- v0.9.8's image step took 3s with every layer CACHED.
#
# There was also a `pull_request` trigger. The job's `if` refused every such
# event, so it did nothing except add a skipped run to every PR.
#
# PRs reach this file through docker-pr.yml instead, and only when they touch
# what the image is built from. On a pull_request event nothing is pushed and no
# cache is written: see the `push:`, `cache-to:` and login lines below.
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # Was `event_name == 'push' || (event_name == 'workflow_call' &&
    # inputs.trigger == 'build')`. The second clause could never be true: a
    # called workflow sees its CALLER's event name, never 'workflow_call', and
    # nothing passes a `trigger` input. It also refused `workflow_dispatch`, so
    # the manual trigger at the top of this file silently skipped.
    #
    # It then became `event_name != 'pull_request'`, refusing PRs outright, so
    # this file was first exercised after it merged. PRs now build here (via
    # docker-pr.yml) and the rule "a PR build must never push" is enforced where
    # pushing actually happens: the two `push:` inputs below.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v7
      -
        # 🔑 A tag must name the version the code declares (#424). A tag pushed
        # before the bump would otherwise publish the previous release's code as
        # `cracktunes:vX.Y.Z`, the exact name the homelab compose files pin to.
        # cargo-dist's release reads the same version, but this image is built
        # independently of it and would not wait for it to fail.
        name: Tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          declared="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cracktunes") | .version')"
          if [ "v${declared}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version '${declared}' in Cargo.toml [workspace.package]. Bump it on master and tag that commit."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches the declared version ${declared}"
      -
        # 🪤 Required before any `cache-to:` below. Without it build-push-action
        # uses the default `docker` driver, which cannot export a cache and
        # fails the whole build with "Cache export is not supported for the
        # docker driver". A cache was added here without it -- which nothing
        # could catch, because PRs never ran this file (#424, since fixed by
        # docker-pr.yml), so it was first exercised on master.
        name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - 
        name: Extract Git Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      -
        # Nothing is pushed from a PR, and a fork PR's token cannot write
        # packages anyway.
        name: Registry Login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build & Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          # 🪤 EXPLICIT. The Dockerfile's last stage is `migrate`, and an
          # unspecified target builds the last stage -- which would publish the
          # migration runner as the bot.
          target: runner
          # push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # This image is built from scratch twice for every release: once on
          # the push to master, then again on the tag, which is what produces
          # the vX.Y.Z tag the compose files pin to. The layers are identical;
          # only the tag differs. A shared GHA layer cache makes the second
          # build a retag rather than a rebuild.
          cache-from: type=gha,scope=runner
          # A PR reads master's cache but never writes one: a PR's cache entries
          # are only visible to that PR, so exporting them (~4 minutes at
          # mode=max) would buy nothing and spend the repo's 10 GB cache quota.
          # TEMPORARY (reverted before merge): the cargo-chef PR writes its own
          # cache so a second run can measure the warm dependency layer.
          cache-to: type=gha,mode=max,scope=runner
      -
        name: Extract Git Metadata (migrate image)
        id: meta-migrate
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrate
      -
        name: Build & Push Migration Image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha,scope=migrate
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=migrate' || '' }}
