name: coverage

# Line coverage with cargo-llvm-cov, uploaded to codecov. Weekly and by hand.
#
# 🔑 Why weekly, not on every push. This report is informational: nothing
# gates on it. The gate that proves tests can fail is cargo-mutants, which
# runs on the diff of each PR. An every-push coverage job is what made the
# old tool (tarpaulin, 9-16 minutes per push, tags included) the slowest job in
# the repo while gating nothing, so it was switched off in 2026-09 and has
# now been replaced.
#
# 🔑 Why cargo-llvm-cov. It uses LLVM source-based coverage instead of ptrace,
# runs on stable rather than nightly, needs no separate instrumented rebuild
# of the world, and emits lcov for codecov. It drives cargo-nextest, so the
# tests run exactly as they do in build.yml.
on:
  workflow_dispatch:
  schedule:
    # Mondays at 05:17 UTC; an off-the-hour minute avoids the scheduler's rush.
    - cron: "17 5 * * 1"

# Least privilege: these jobs only check out and build.
permissions:
  contents: read

jobs:
  test:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v7

      - name: "Install dependencies"
        run: |
          sudo apt-get update && sudo apt-get install -y cmake
        shell: bash

      - name: "Install Rust"
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add llvm-tools-preview
        shell: bash

      - name: "Install yt-dlp"
        run: |
          curl -sSL --output /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x /usr/local/bin/yt-dlp
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.149

      - uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: postgres
          password: mysecretpassword
          database: postgres
          port: 5432
          # 🪤 PIN THIS. v4 used the runner's preinstalled server, which is
          # 16.15; v8 installs from PGDG and defaults to 18. Both stacks run
          # postgres:16-alpine, so an unpinned major would test the bot
          # against a server it never runs on.
          postgres-version: "16"
        id: postgres

      - name: Generate code coverage
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
          PG_USER: postgres
          PG_PASSWORD: mysecretpassword
          VIRUSTOTAL_API_KEY: ${{secrets.VIRUSTOTAL_API_KEY}}
          WEBHOOK_SECRET: ${{secrets.WEBHOOK_SECRET}}
          # The committed .sqlx/ answers every query! macro, so the build
          # needs no live database for type checking.
          SQLX_OFFLINE: "true"
        run: |
          cargo llvm-cov nextest --profile ci --workspace --features crack-core/db-tests,cracktunes/db-tests,crack-voting/db-tests,crack-core/crack-coin --lcov --output-path lcov.info

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
