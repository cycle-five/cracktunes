name: Lint

on:
  workflow_call:

# Least privilege: these jobs only check out and build.
permissions:
  contents: read

# 🪤 CMake 4 on ubuntu-26.04 refuses audiopus_sys's old
# cmake_minimum_required; see build.yml.
env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  lint:
    name: Fmt and clippy
    strategy:
      matrix:
        rust-version: ["nightly", "stable"]
        cache-key: [""]
    runs-on: ubuntu-latest

    # fmt and clippy never touch the database. `sqlx::query!` expands against
    # the committed `.sqlx/` metadata, so this job needs no postgres, no
    # sqlx-cli and no migrations -- they cost ~50s a leg and checked nothing.
    # build.yml still runs the real thing against a real database.
    env:
      SQLX_OFFLINE: "true"

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # There was an `apt-get update && dist-upgrade && autoremove` here. It
      # took 2m10s a leg -- 4m20s per CI run, ~19% of the whole thing -- to
      # upgrade the entire runner OS before running fmt and clippy, which
      # need nothing from it. GitHub rebuilds these images weekly anyway.

      - name: "Install Rust"
        run: |
          rustup toolchain install ${{ matrix.rust-version }} --profile minimal --no-self-update
          rustup component add rustfmt clippy --toolchain ${{ matrix.rust-version }}
          rustup default ${{ matrix.rust-version }}
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache-key }}

      # 🪤 This was `if: ${{ matrix.rust-version }} == 'nightly'`, which does
      # not do what it reads as: the expression is substituted, the trailing
      # `== 'nightly'` is left as dead text, and a non-empty leading value is
      # truthy -- so fmt ran on BOTH legs. The stable leg then silently
      # ignored rustfmt.toml's nightly-only `imports_layout` and
      # `match_arm_blocks` (it warns and carries on), so it was enforcing
      # something weaker than the nightly leg while appearing to agree.
      - name: Run cargo fmt
        if: matrix.rust-version == 'nightly'
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: success() || failure()
        run: cargo clippy --all -- -D clippy::all -D warnings --allow clippy::needless_return

      # crack-model is the platform-neutral layer: nothing it depends on may
      # be a chat-platform, runtime-networking or database crate.
      - name: crack-model depends on no platform crate
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-model -e normal --prefix none)
          if echo "$tree" | grep -E '^(serenity|poise|songbird|sqlx|reqwest)'; then
            echo "crack-model must not depend on a platform crate" >&2
            exit 1
          fi

      # crack-common holds the errors and neutral messages: it may use
      # serenity and songbird, never poise or crack-core.
      - name: crack-common depends on no poise or crack-core
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-common -e normal --prefix none)
          if echo "$tree" | grep -E '^(poise|crack-core) '; then
            echo "crack-common must not depend on poise or crack-core" >&2
            exit 1
          fi

      # Dev-dependencies count too: `cargo test -p crack-common` must not build crack-core.
      - name: crack-common has no crack-core dev-dependency
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-common -e normal,dev --prefix none)
          if echo "$tree" | grep -E '^crack-core '; then
            echo "crack-common must not depend on crack-core, even in tests" >&2
            exit 1
          fi

      # crack-economy holds the economy and its CrackCoin glue: it may use
      # serenity, never poise or crack-core.
      - name: crack-economy depends on no poise or crack-core
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-economy -e normal --prefix none)
          if echo "$tree" | grep -E '^(poise|crack-core) '; then
            echo "crack-economy must not depend on poise or crack-core" >&2
            exit 1
          fi

      # crack-rooms holds the voice rooms, the mod log and their queries: it may
      # use serenity and crack-economy, never poise or crack-core.
      - name: crack-rooms depends on no poise or crack-core
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-rooms -e normal --prefix none)
          if echo "$tree" | grep -E '^(poise|crack-core) '; then
            echo "crack-rooms must not depend on poise or crack-core" >&2
            exit 1
          fi

      # crack-guild holds the guild settings, the per-guild cache and their
      # queries: it may use serenity, never poise or crack-core.
      - name: crack-guild depends on no poise, crack-core, crack-economy or crack-rooms
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-guild -e normal --prefix none)
          if echo "$tree" | grep -E '^(poise|crack-core|crack-economy|crack-rooms) '; then
            echo "crack-guild must not depend on poise, crack-core, crack-economy or crack-rooms" >&2
            exit 1
          fi

      # crack-music holds the music player, its sources and its tables: it may
      # use serenity and songbird, never poise or crack-core.
      - name: crack-music depends on no poise, crack-core, crack-economy or crack-rooms
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-music -e normal --prefix none)
          if echo "$tree" | grep -E '^(poise|crack-core|crack-economy|crack-rooms) '; then
            echo "crack-music must not depend on poise, crack-core, crack-economy or crack-rooms" >&2
            exit 1
          fi

      # crack-gp holds the /gp game, its saved form, its prompts and its table: it
      # may use crack-music, serenity and songbird, never poise or crack-core.
      - name: crack-gp depends on no poise, crack-core, crack-economy or crack-rooms
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-gp -e normal --prefix none)
          if echo "$tree" | grep -E '^(poise|crack-core|crack-economy|crack-rooms) '; then
            echo "crack-gp must not depend on poise, crack-core, crack-economy or crack-rooms" >&2
            exit 1
          fi

      # crack-test-db is test tooling shared by the crates' db tests: no poise,
      # no crack-core (crack-core depends on it, not the other way round).
      - name: crack-test-db depends on no poise or crack-core
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-test-db -e normal --prefix none)
          if echo "$tree" | grep -E '^(poise|crack-core) '; then
            echo "crack-test-db must not depend on poise or crack-core" >&2
            exit 1
          fi

      # Dev-dependencies count too: `cargo test -p crack-economy` must not build crack-core.
      - name: crack-economy has no crack-core dev-dependency
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-economy -e normal,dev --prefix none)
          if echo "$tree" | grep -E '^crack-core '; then
            echo "crack-economy must not depend on crack-core, even in tests" >&2
            exit 1
          fi

      # Dev-dependencies count too: `cargo test -p crack-rooms` must not build crack-core.
      - name: crack-rooms has no crack-core dev-dependency
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-rooms -e normal,dev --prefix none)
          if echo "$tree" | grep -E '^crack-core '; then
            echo "crack-rooms must not depend on crack-core, even in tests" >&2
            exit 1
          fi

      # Dev-dependencies count too: `cargo test -p crack-guild` must not build crack-core.
      - name: crack-guild has no crack-core dev-dependency
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-guild -e normal,dev --prefix none)
          if echo "$tree" | grep -E '^crack-core '; then
            echo "crack-guild must not depend on crack-core, even in tests" >&2
            exit 1
          fi

      # Dev-dependencies count too: `cargo test -p crack-music` must not build crack-core.
      - name: crack-music has no crack-core dev-dependency
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-music -e normal,dev --prefix none)
          if echo "$tree" | grep -E '^crack-core '; then
            echo "crack-music must not depend on crack-core, even in tests" >&2
            exit 1
          fi

      # Dev-dependencies count too: `cargo test -p crack-gp` must not build crack-core.
      - name: crack-gp has no crack-core dev-dependency
        if: success() || failure()
        run: |
          tree=$(cargo tree -p crack-gp -e normal,dev --prefix none)
          if echo "$tree" | grep -E '^crack-core '; then
            echo "crack-gp must not depend on crack-core, even in tests" >&2
            exit 1
          fi

      # 🔑 The only job that compiles the optional-module seam. crack-bf and
      # crack-osint now live in their own repositories, so their crates are
      # gated by their own CI -- but `commands/osint.rs`, `commands/bf.rs` and
      # the osint arms in `crack-common/src/message.rs` are the seam BETWEEN them, and
      # nothing else here builds it: this workflow's clippy passes no features,
      # build.yml passes only the db-tests ones, and rust-clippy.yml's
      # --all-features run is continue-on-error and never runs on a PR.
      #
      # Without this, a new crack-osint release that reshuffles its default
      # features breaks `--features crack-osint` here and no job reports it --
      # the exact rot this extraction was done to stop.
      - name: Check the optional module seam
        if: success() || failure()
        run: cargo check -p crack-core --features crack-bf,crack-osint,crack-coin --locked

      # The gated glue (`crate::coin`) compiles only with its feature, so the
      # featureless clippy above never lints it.
      - name: Clippy the crack-coin glue
        if: success() || failure()
        run: cargo clippy -p crack-core --features crack-coin --locked -- -D warnings

      # crack-economy's own CrackCoin glue (`coin`) is gated the same way.
      - name: Clippy the crack-economy crack-coin glue
        if: success() || failure()
        run: cargo clippy -p crack-economy --features crack-coin --locked -- -D warnings

  # 🔑 The mutants tooling is Python: scripts/mutants_check.py (the check),
  # scripts/check_waivers.py (every waiver carries a reason) and
  # scripts/sweep_target.py (the target sweep), with unittest tests beside
  # them. The opt-in Mutants job runs these scripts, so a broken one has to fail
  # here, not when someone finally labels a PR. Standard library only, so
  # the runner's own python3 is enough: no setup step, no Rust.
  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Run the scripts' unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Every mutants waiver has a reason
        run: python3 scripts/check_waivers.py
