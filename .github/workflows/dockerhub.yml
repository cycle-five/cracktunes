# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Dockerhub

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    tags: ['v*.*.*']
  pull_request:
    branches:
      - 'master'
  workflow_call:

env:
  REGISTRY: docker.io
  IMAGE_NAME: cyclefive/cracktunes 

jobs:
  push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    # Never on a pull request. Dependabot PRs carry no secrets, so the
    # Docker Hub login below fails outright -- but the real hazard is the
    # branch where it would succeed: a PR build pushed under `push: true`
    # publishes unreviewed code to cyclefive/cracktunes. docker.yml (GHCR)
    # has carried this same guard all along; only this file lost it.
    #
    # The old second clause (`event_name == 'workflow_call' &&
    # inputs.trigger == 'build'`) could never be true -- a called workflow sees
    # its caller's event name, and no `trigger` input exists (actionlint flags
    # it). It also refused `workflow_dispatch`. Same fix as docker.yml.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - 
        name: Repository Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - 
        name: Extract Git Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      -
        name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          # 🪤 EXPLICIT. The Dockerfile's last stage is `migrate`, and an
          # unspecified target builds the last stage -- which would publish the
          # migration runner as the bot.
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 🔑 Read-only use of the cache docker.yml writes. This file had no
          # cache at all, so every tag push recompiled the whole bot from
          # scratch for an image whose layers already existed: v0.9.8 took 26m
          # here while docker.yml's build of the same commit took 3s.
          #
          # Same Dockerfile, same `target: runner`, same context -- the layer
          # keys are identical, so the GHCR build's cache is this build's
          # cache. No `cache-to`: two writers racing one scope is what
          # docker.yml's own duplicate master build was doing.
          #
          # On a master push this still compiles (it starts at once, while
          # ci_workflow's Docker job waits ~12m for Build and Lint), but the
          # apk and sqlx-cli layers above `COPY . .` now come from cache.
          cache-from: type=gha,scope=runner
