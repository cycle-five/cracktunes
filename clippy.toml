# songbird offers FOUR ways to start a voice connection. None of them checks
# Discord permissions, and after a failure they leave a connectionless `Call`
# registered that a later join finds and mistakes for success.
#
# `music_utils::join_permitted` is the one wrapper that gates and cleans up,
# and it takes a `perms::JoinPermit` -- which only `ensure_can_join` can mint.
# The permit makes the *ordering* a compile error; these rules make the permit
# unavoidable by closing every door but one.
#
# 🪤 Banning only `Songbird::join` was not enough, and the gap was real rather
# than theoretical: ~17 sites in this crate hold an `Arc<Mutex<Call>>`, so
# `call.lock().await.join(chan)` was reachable with no permit and no lint. The
# source-scanning guard this replaced matched any `.join(` whose first argument
# was not a string literal, so it *would* have caught that one -- the type plus
# a single lint was a net regression until these three were added.
#
# Three sites once cleaned up after a failed join three different ways (#502);
# two of the three were wrong. There is now one implementation.
disallowed-methods = [
    { path = "songbird::Songbird::join", reason = "does not check permissions and leaves a connectionless Call behind on failure; use music_utils::join_permitted, which takes a perms::JoinPermit" },
    { path = "songbird::Songbird::join_gateway", reason = "same as Songbird::join, and additionally hands back raw gateway state; use music_utils::join_permitted" },
    { path = "songbird::Call::join", reason = "reachable from any held Arc<Mutex<Call>> and bypasses the permission gate entirely; use music_utils::join_permitted" },
    { path = "songbird::Call::join_gateway", reason = "reachable from any held Arc<Mutex<Call>> and bypasses the permission gate entirely; use music_utils::join_permitted" },
    # 🪤 `get` is not a connection test (#507). songbird registers the Call when
    # a join is *attempted*, so a join that timed out still hands one back.
    # Eight commands asked `get(..).ok_or(NotConnected)` -- naming the question
    # they meant while asking one that cannot answer it. The few sites that
    # genuinely want "is a Call registered" carry an `#[allow]` saying why.
    { path = "songbird::Songbird::get", reason = "returns a Call for a join that only STARTED, before the gateway handshake; use music_utils::connected_call to ask whether we are actually connected" },
    # 🪤 Every reader of a queued track -- `/queue`, `/nowplaying`, `/lyrics`,
    # autoplay's refill -- downcasts its data to `TrackData`, and
    # `TrackHandle::data` panics on a track built without it. v0.12.0's autoplay
    # built one with `source.into()`, and the panic, inside the track-end
    # handler, stopped that call's queue for good.
    #
    # `queue::new_track` is the one constructor and returns a `QueuedTrack`;
    # `queue::enqueue` is the one thing that takes one. These close every other
    # door: songbird's `Track` constructors, and every songbird method that
    # queues or plays a bare `Track` or `Input`. `Track::from(input)` is a
    # blanket `From` and cannot be banned, which is why the queueing side has
    # to be closed completely -- a track built that way has nowhere to go.
    { path = "songbird::tracks::Track::new", reason = "a Track without TrackData panics its first reader; use queue::new_track" },
    { path = "songbird::tracks::Track::new_with_uuid", reason = "a Track without TrackData panics its first reader; use queue::new_track" },
    { path = "songbird::tracks::Track::new_with_data", reason = "only queue::new_track may attach the data, so every Track carries TrackData; use queue::new_track" },
    { path = "songbird::tracks::Track::new_with_uuid_and_data", reason = "only queue::new_track may attach the data, so every Track carries TrackData; use queue::new_track" },
    { path = "songbird::driver::Driver::enqueue", reason = "queues a bare Track, which may carry no TrackData, and derives preload by running yt-dlp; build a queue::QueuedTrack and use the functions in music::queue" },
    { path = "songbird::driver::Driver::enqueue_input", reason = "queues an Input with no TrackData at all; use the functions in music::queue" },
    { path = "songbird::driver::Driver::enqueue_with_preload", reason = "queues a bare Track, which may carry no TrackData; use the functions in music::queue, which take a queue::QueuedTrack" },
    { path = "songbird::driver::Driver::play", reason = "plays a bare Track outside the queue, which may carry no TrackData; use the functions in music::queue" },
    { path = "songbird::driver::Driver::play_input", reason = "plays an Input with no TrackData at all; use the functions in music::queue" },
    { path = "songbird::driver::Driver::play_only", reason = "plays a bare Track outside the queue, which may carry no TrackData; use the functions in music::queue" },
    { path = "songbird::driver::Driver::play_only_input", reason = "plays an Input with no TrackData at all; use the functions in music::queue" },
    { path = "songbird::tracks::TrackQueue::add", reason = "queues a bare Track, which may carry no TrackData; use the functions in music::queue" },
    { path = "songbird::tracks::TrackQueue::add_source", reason = "queues an Input with no TrackData at all; use the functions in music::queue" },
    { path = "songbird::tracks::TrackQueue::add_with_preload", reason = "queues a bare Track, which may carry no TrackData; use the functions in music::queue" },
    { path = "songbird::tracks::TrackHandle::data", reason = "panics on a track without TrackData; use utils::get_track_handle_metadata or utils::get_requesting_user" },
    # 🪤 songbird runs every event handler inline on the call's one event task,
    # which holds the call's handlers, track event stores and track states as
    # locals. One panicking handler unwinds it, and the queue stops advancing
    # with nothing logged -- what the autoplay panic above actually did.
    # `handlers::guarded` catches a handler's panic at its boundary.
    { path = "songbird::driver::Driver::add_global_event", reason = "a panicking handler takes the call's event task, and its queue, down with it; use handlers::add_global_handler" },
    { path = "songbird::tracks::TrackHandle::add_event", reason = "a panicking handler takes the call's event task, and its queue, down with it; use handlers::add_track_handler" },
    { path = "songbird::events::EventStore::add_event", reason = "registers a handler with no panic guard; use handlers::add_global_handler or handlers::add_track_handler" },
    # 🪤 rusty_ytdl finds videos but cannot play them. The googlevideo URL its
    # stream fetches 403s (`c=ANDROID`), songbird gets an empty stream, and
    # symphonia reports "no suitable format reader found" -- which reads like a
    # codec problem and is not one. yt-dlp plays everything:
    # `queue::build_track` for resolved tracks, `youtube::source_for_search_hit`
    # for search hits. `/play`'s fallback streamed through rusty_ytdl until
    # v0.12.1, so every play that reached it was queued and silently dropped.
    { path = "rusty_ytdl::Video::stream", reason = "its stream comes back empty, so the track is dropped as it starts; play through songbird's YoutubeDl, as queue::build_track and youtube::source_for_search_hit do" },
    { path = "rusty_ytdl::Video::stream_with_ffmpeg", reason = "its stream comes back empty, so the track is dropped as it starts; play through songbird's YoutubeDl, as queue::build_track and youtube::source_for_search_hit do" },
    { path = "rusty_ytdl::blocking::Video::stream", reason = "its stream comes back empty, so the track is dropped as it starts; play through songbird's YoutubeDl, as queue::build_track and youtube::source_for_search_hit do" },
    { path = "rusty_ytdl::blocking::Video::stream_with_ffmpeg", reason = "its stream comes back empty, so the track is dropped as it starts; play through songbird's YoutubeDl, as queue::build_track and youtube::source_for_search_hit do" },
    # 🪤 The queue audit log (docs/superpowers/specs/2026-09-30-queue-audit-log-design.md)
    # is recorded by the primitives in `music::queue` and by `music::disconnect`.
    # A change made anywhere else is a change nobody can account for, so these
    # close every other door, as the Songbird::get ban above does for joins.
    { path = "songbird::tracks::TrackQueue::skip", reason = "changes the queue without an audit record; use the primitives in music::queue" },
    { path = "songbird::tracks::TrackQueue::stop", reason = "changes the queue without an audit record; use music::queue::stop_queue" },
    { path = "songbird::tracks::TrackQueue::dequeue", reason = "changes the queue without an audit record; use the primitives in music::queue" },
    { path = "songbird::tracks::TrackQueue::modify_queue", reason = "changes the queue without an audit record; use the primitives in music::queue" },
    { path = "songbird::tracks::TrackQueue::pause", reason = "changes the queue without an audit record; use music::queue::pause_queue" },
    { path = "songbird::tracks::TrackQueue::resume", reason = "changes the queue without an audit record; use music::queue::resume_queue" },
    { path = "songbird::Songbird::remove", reason = "discards the queue without an audit record; use music::disconnect::disconnect" },
    { path = "songbird::Songbird::leave", reason = "discards the queue without an audit record; use music::disconnect::disconnect" },
    { path = "songbird::Call::leave", reason = "discards the queue without an audit record; use music::disconnect::disconnect" },
    { path = "songbird::tracks::TrackHandle::stop", reason = "stopping the current track is a skip, made without an audit record; use music::queue::force_skip_top_track" },
    { path = "songbird::tracks::TrackHandle::pause", reason = "pausing the current track is a pause, made without an audit record; use music::queue::pause_queue" },
    { path = "songbird::tracks::TrackHandle::play", reason = "playing the current track is a resume, made without an audit record; use music::queue::resume_queue" },
    { path = "songbird::driver::Driver::stop", reason = "stops the whole queue without an audit record; use music::queue::stop_queue" },
    # 🔒 songbird hands `YoutubeDl::new`'s string to yt-dlp as a bare positional
    # argument, with no `--` in front of it, so a string starting with `-` is read
    # as an option. A playlist id of `--batch-file=/proc/self/environ` leaked the
    # bot's environment to Discord this way (v0.17.2). Links go through
    # `crack_types::ytdl_for_url`, which only accepts http(s) URLs; search text goes
    # through `YoutubeDl::new_search`, whose `ytsearchN:` prefix it cannot escape.
    { path = "songbird::input::YoutubeDl::new", reason = "yt-dlp reads a string starting with `-` as an option; use crack_types::ytdl_for_url for links or YoutubeDl::new_search for search text" },
    { path = "songbird::input::YoutubeDl::new_ytdl_like", reason = "yt-dlp reads a string starting with `-` as an option; use crack_types::ytdl_for_url for links or YoutubeDl::new_search for search text" },
    # 🔒 Every user-initiated playback/queue change is orchestrated in music::ops
    # (spec 2026-10-04): it takes the lease, makes the call, records the audit
    # row. These are its primitives. /gp (the game owner) and autopause (the bot)
    # are the only other callers, each with a reasoned #[expect].
    { path = "crack_core::music::queue::pause_queue", reason = "orchestrate through music::ops" },
    { path = "crack_core::music::queue::resume_queue", reason = "orchestrate through music::ops" },
    { path = "crack_core::music::queue::remove_at", reason = "orchestrate through music::ops" },
    { path = "crack_core::music::queue::stop_queue", reason = "orchestrate through music::ops" },
    { path = "crack_core::music::queue::clear_from", reason = "orchestrate through music::ops" },
    { path = "crack_core::music::queue::drain_after_current", reason = "orchestrate through music::ops" },
    { path = "crack_core::music::queue::shuffle_behind_current", reason = "orchestrate through music::ops" },
    { path = "crack_core::music::queue::move_track", reason = "orchestrate through music::ops" },
    { path = "crack_core::music::queue::move_track_by_id", reason = "orchestrate through music::ops" },
    { path = "crack_core::music::queue::force_skip_top_track", reason = "orchestrate through music::ops" },
    # 🔒 Every music-facing message is rendered by `messaging::render` and
    # delivered by `messaging::courier` (spec 2026-10-07): replies through a
    # `ReplySink`, channel posts and edits through a `Transport`. That is where
    # mentions are pinned to nobody, titles are escaped, `EMBED_LINKS` is
    # degraded around, and an edit goes to the handle it was given rather than
    # `@original` (#494). A raw send skips all of it, so these close the doors.
    # `messaging` carries the reasoned #[expect]s; modules not yet migrated
    # carry a module-level one ("messaging arc: not migrated yet"), which is the
    # follow-ups' to-do list. `ChannelId` has no send of its own in this
    # serenity: it widens to `GenericChannelId`, which is banned here.
    { path = "serenity::model::id::GenericChannelId::send_message", reason = "send through messaging::courier" },
    { path = "serenity::model::id::GenericChannelId::say", reason = "send through messaging::courier" },
    { path = "serenity::model::id::GenericChannelId::edit_message", reason = "edit through messaging::courier" },
    { path = "serenity::model::id::GenericChannelId::delete_message", reason = "delete through messaging::transport::Transport" },
    { path = "serenity::model::channel::GuildChannel::send_message", reason = "send through messaging::courier" },
    { path = "serenity::model::channel::Message::reply", reason = "reply through messaging::courier" },
    { path = "serenity::model::channel::Message::reply_ping", reason = "reply through messaging::courier, which pings nobody unless the message says so" },
    { path = "serenity::model::channel::Message::edit", reason = "edit through messaging::courier" },
    { path = "serenity::model::application::ComponentInteraction::create_response", reason = "respond through messaging::courier" },
    { path = "serenity::model::application::ComponentInteraction::edit_response", reason = "edit through messaging::courier" },
    { path = "serenity::model::application::ComponentInteraction::create_followup", reason = "reply through messaging::courier" },
    { path = "serenity::model::application::CommandInteraction::create_response", reason = "reply through messaging::courier" },
    { path = "serenity::model::application::CommandInteraction::edit_response", reason = "edits @original, whichever message was meant (#494); edit the reply handle through messaging::courier" },
    { path = "serenity::model::application::CommandInteraction::create_followup", reason = "reply through messaging::courier" },
    { path = "poise::Context::send", reason = "reply through messaging::courier" },
    { path = "poise::Context::say", reason = "reply through messaging::courier" },
    { path = "poise::Context::reply", reason = "reply through messaging::courier" },
    { path = "poise::send_reply", reason = "reply through messaging::courier" },
    { path = "poise::say_reply", reason = "reply through messaging::courier" },
    { path = "poise::ReplyHandle::edit", reason = "edit through messaging::courier" },
]
