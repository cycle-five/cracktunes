[package]
name = "crack-web"
version.workspace = true
edition = "2021"
authors = ["Cycle Five <cycle.five@proton.me>"]
publish = true
license = "MIT"
description = "The Crack Tunes web dashboard: view and reorder a guild's queue."
homepage = "https://cracktun.es/"
repository = "https://github.com/cycle-five/cracktunes"
workspace = ".."

[features]
# The features a cargo-mutants run needs, valid on any one crate: see .cargo/mutants.toml.
mutation-testing = []

[dependencies]
crack-core = { path = "../crack-core" }
crack-model = { path = "../crack-model" }
crack-types = { path = "../crack-types" }
# The website login flow. Memory storage: nothing about web users is persisted
# yet. (0.2's SqlxStorage would now coexist with our migrations, in its own
# `catacombs_*` tables, if that ever changes.)
catacombs = { version = "0.2", default-features = false, features = ["memory-storage", "rustls-tls"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["timeout"] }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
serenity = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
uuid = { version = "1", features = ["serde", "v4"] }
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# `#[cfg_attr(test, mutants::skip)]` waivers: see docs/testing.md.
mutants = "0.0.4"

[lints]
workspace = true
