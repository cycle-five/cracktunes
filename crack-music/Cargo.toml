[package]
name = "crack-music"
version.workspace = true
edition = "2021"
authors = ["Cycle Five <cycle.five@proton.me>"]
publish = true
license = "MIT"
description = "The music player, its sources and its tables for Crack Tunes."
keywords = ["music", "bot", "crack", "tunes", "player"]
homepage = "https://cracktun.es/"
repository = "https://github.com/cycle-five/cracktunes"
workspace = ".."

[features]
# Tests that need a live postgres at DATABASE_URL: see docs/testing.md.
db-tests = []
# The features a cargo-mutants run needs, valid on any one crate: see .cargo/mutants.toml.
mutation-testing = ["db-tests"]
# The fixtures in `music::ops::test_support`, for other crates' tests: enable as a dev-dependency.
test-support = []

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.1"
dashmap = "6"
futures = "0.3"
itertools = "0.15"
lazy_static = "1.5"
once_cell = "1.20"
rand = "0.10"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
url = "2.5"
uuid = "1"
regex = "1.11"
crack-common = { path = "../crack-common" }
crack-guild = { path = "../crack-guild" }
crack-model = { path = "../crack-model" }
crack-types = { path = "../crack-types" }
crack-testing = { path = "../crack-testing" }
crack-sleevenote = { path = "../crack-sleevenote" }
crack-musicreco = { path = "../crack-musicreco" }

reqwest = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
serenity = { workspace = true }
songbird = { workspace = true }
tokio = { workspace = true }
symphonia = { workspace = true }

[dependencies.rusty_ytdl]
version = "0.7.4"
default-features = false
features = ["live", "rustls-tls", "search", "blocking", "ffmpeg"]

[dependencies.rspotify]
version = "0.16"
default-features = false
features = ["client-reqwest", "reqwest-rustls-tls"]

[dev-dependencies]
ctor = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crack-test-macros = { path = "../crack-test-macros" }
crack-test-db = { path = "../crack-test-db" }
crack-common = { path = "../crack-common", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
