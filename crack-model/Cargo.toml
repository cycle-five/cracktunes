[package]
name = "crack-model"
version.workspace = true
edition = "2021"
authors = ["Cycle Five <cycle.five@proton.me>"]
publish = true
license = "MIT"
description = "Platform-neutral types for Crack Tunes."
keywords = ["music", "bot", "crack", "tunes", "types"]
categories = [
  "multimedia::audio",
  "multimedia::music",
  "multimedia::bot",
]
homepage = "https://cracktun.es/"
# The official main repo is sr.ht, this is needed for the CI/CD pipeline.
#repository = "https://git.sr.ht/~cycle-five/cracktunes"
repository = "https://github.com/cycle-five/cracktunes"
workspace = ".."

[features]
# The features a cargo-mutants run needs, valid on any one crate: see .cargo/mutants.toml.
mutation-testing = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.20"

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
