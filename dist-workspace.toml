[workspace]
members = ["cargo:crack-cli"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.25.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Stop dist from regenerating (and checking) release.yml. The generated file asks
# for the retired ubuntu-20.04 runner, so it is hand-edited to say ubuntu-latest;
# without this, `dist plan` fails the release with a diff against its own output.
# Drop this once cargo-dist-version is bumped and the file is regenerated.
allow-dirty = ["ci"]
# Where to host releases
hosting = "github"
custom-success-message = "Be of Mæth and malinger not with Commies!"
# Run on latest ubuntu
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-latest"

[[dist.extra-artifacts]]
artifacts = ["data.tar"]
build = ["tar", "-cf", "data.tar", "data"]
