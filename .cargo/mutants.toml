# cargo-mutants configuration (read by default from .cargo/mutants.toml).
# 🔑 The file is read with `deny_unknown_fields`, so a misspelt key is an error
# rather than a silently ignored setting.

# nextest runs each mutant's tests in parallel processes and, with the
# `mutants` profile in .config/nextest.toml, stops at the first failure.
# That profile is chosen through NEXTEST_PROFILE (scripts/mutants.sh sets it),
# because a flag could clash with `profile` below.
test_tool = "nextest"

# The database tests and CrackCoin are behind features that are off by
# default. Without them the code those tests cover would show every mutant as
# missed, for the wrong reason.
#
# 🪤 The names carry no `package/` prefix on purpose. cargo turns a bare name on
# in every selected package that has it, while `cracktunes/db-tests` is an
# error whenever cracktunes is not selected. The unmutated BASELINE selects
# only the crates that have mutants (`--package crack-core`), even with
# test_workspace below, so prefixed names failed it for any run that did not
# touch all three owners of db-tests (cracktunes, crack-core, crack-voting).
# 🪤 A bare name still fails when NO selected crate has it: a run whose mutants
# all sit in crack-types, crack-web, crack-sleevenote, crack-musicreco or
# crack-testing stops at once with "does not contain this feature". Pass
# `--baseline skip` for that run (CI's plain test jobs check the tree).
features = ["db-tests", "crack-coin"]

# Each mutant is built with `--workspace` and checked against every crate's
# tests, which is right for a workspace where crack-core is used by the others.
test_workspace = true

# The cargo profile that mutants build with: see [profile.mutants] in the root
# Cargo.toml.
profile = "mutants"

# Exclusions are for code that is never worth testing, each with its reason.
# 🪤 Legacy misses do NOT go here. They go to the baseline, so that the debt
# stays visible and shrinks on purpose.
exclude_globs = [
    # Test tooling. Every crack-core database test exercises it, but
    # cargo-mutants only runs the tests of the package it mutates, so each
    # mutant here would look missed.
    "crack-test-macros/**",
]
