# cargo-mutants configuration (read by default from .cargo/mutants.toml).
# 🔑 The file is read with `deny_unknown_fields`, so a misspelt key is an error
# rather than a silently ignored setting.

# nextest runs each mutant's tests in parallel processes and, with the
# `mutants` profile in .config/nextest.toml, stops at the first failure.
# That profile is chosen through NEXTEST_PROFILE (scripts/mutants.sh sets it),
# because a flag could clash with `profile` below.
test_tool = "nextest"

# The database tests and CrackCoin are behind features that are off by
# default. Without them the code those tests cover would show every mutant as
# missed, for the wrong reason.
#
# 🔑 One umbrella feature, `mutation-testing`, that every crate defines: in
# crack-core, crack-economy and cracktunes it turns on `db-tests` and
# `crack-coin`, in crack-rooms, crack-guild, crack-music, crack-gp, crack-voting and crack-test-db `db-tests`, and
# elsewhere nothing. cargo-mutants passes
# `--features` to EVERY cargo call, including the per-crate ones (each mutant
# builds and tests only its own crate, below). cargo rejects a feature that no
# selected crate has, so `db-tests` on its own would make every mutant in
# crack-types, crack-web, crack-sleevenote, crack-musicreco or crack-testing
# unviable. A name every crate owns is valid whichever crates a call selects.
# 🪤 A new workspace member needs `mutation-testing` too, even an empty one.
features = ["mutation-testing"]

# test_workspace is left at its default: each mutant is tested with its own
# crate's tests (`--package <crate>`), and the unmutated baseline with the
# tests of every crate that has mutants. Baseline and mutants so test the same
# crates, the baseline a superset. 🪤 `test_workspace = true` tested each
# mutant with `--workspace` but the baseline only per crate, so a failing or
# flaky test elsewhere passed the baseline and then made every mutant look
# caught. The cost of the default: a crack-core mutant that only a cracktunes
# or crack-web test would catch (the two crates that use crack-core) shows as
# missed. That errs the safe way.

# The cargo profile that mutants build with: see [profile.mutants] in the root
# Cargo.toml.
profile = "mutants"

# Scratch copies leave out what .gitignore lists: `.env` (secrets), `data/`,
# `.superpowers/` and the like. A mutant run then sees only the tree the tests
# see in CI, and secrets are not copied into $HOME/.cache/cargo-mutants.
# 🪤 .gitignore also matches a few TRACKED files (`cracktunes.toml`, `data/*`),
# and those are left out too. No build or test reads them today; a test that
# starts to would fail the unmutated baseline, not hide among the mutants.
# (Irrelevant to CI's module pass, mutants-full.yml, which mutates its
# checkout in place on a disposable runner.)
gitignore = true

# Exclusions are for code that is never worth testing, each with its reason
# (scripts/check_waivers.py enforces one per element).
# 🪤 Legacy misses do NOT go here: an exclusion hides a mutant from every run
# for good. They are worked down on purpose, a module at a time, in module
# passes (mutants-full.yml), and nothing lists them in between; the diff check
# reports the ones a change touches as old.
exclude_globs = [
    # Test-only tooling: a proc-macro that never ships in the bot. Mutating
    # it says nothing about the bot. (It is also the one crate without the
    # `mutation-testing` feature, so its mutants could not build.)
    "crack-test-macros/**",
    # Test-only tooling: the template-database runner never ships in the bot.
    # As `#[cfg(test)]` code inside crack-core it listed no mutants; as its own
    # crate it would, and mutating it says nothing about the bot.
    "crack-test-db/**",
    # Test-only fakes (FakeTransport, FakePress), compiled into crack-common
    # only under `cfg(test)` or the `test-support` feature. As `#[cfg(test)]`
    # code in crack-core they listed no mutants; here they would, and mutating
    # a stand-in Discord says nothing about the bot.
    "crack-common/src/test_support.rs",
    # Test-only fixtures (test_music_data, RecordingSurface, queue_of, ...),
    # compiled into crack-music only under `cfg(test)` or the `test-support`
    # feature. As `#[cfg(test)]` code in crack-core they listed no mutants; here
    # they would, and mutating a test fake says nothing about the bot.
    "crack-music/src/music/ops/test_support.rs",
    # Test-only fixtures (a started game, a submitted song, a seeded rng),
    # compiled into crack-gp only under `cfg(test)` or the `test-support` feature.
    "crack-gp/src/gp/test_support.rs",
]

# 🔑 The one exception to "legacy misses don't go here" (owner's call,
# 2026-10-25). It covers one mutant per function: a command entry point's whole
# body replaced with `Ok(())`. These bodies talk to live Discord, so no offline
# test can see them do nothing. In the local runs of 2026-10-22..25, all 29
# that ran were missed, and each diff check that touched one reran it on the
# base just to call it old. Their other mutants (operators, deleted `!`, etc.)
# are still tested.
# 🪤 Scoped to the command-entry files on purpose. /gp's playback helpers
# (commands/music/gp/) and commands/permissions.rs have tested whole-body
# mutants, and those were caught, so they stay in. Measured: this excludes 141
# of the 1,486 mutants under crack-core/src/commands.
exclude_re = [
    # Live-Discord glue: a poise command entry point's whole body, which only a live Discord can observe.
    '^crack-core/src/commands/(admin/.*|economy/.*|utility/.*|music/[^/]+|register|status)\.rs:[0-9]+:[0-9]+: replace \S+ -> Result<\(\), (Error|serenity::Error|CrackedError)> with Ok\(\(\)\)$',
    # Test-only helpers: first_embed and extra_embeds are compiled only under `cfg(test)` or the `test-support` feature, for other crates' tests to read a built message. Nothing in crack-common calls them, so their mutants would show as missed for the wrong reason.
    '^crack-common/src/discord\.rs:[0-9]+:[0-9]+: replace (first_embed|extra_embeds) ',
]
